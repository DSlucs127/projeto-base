[package]
name = "tauri-fullstack"
version = "1.0.0"
description = "Tauri v2 wrapper for the fullstack responsive application"
authors = ["Template Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tauri_fullstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tauri-fullstack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
